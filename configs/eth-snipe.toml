# Профиль: ETH снайпинг свежесозданных пар (Factory PairCreated) — третья,
# принципиально отдельная стратегия от арбитража/копитрейдинга (нет ни
# существующего перекоса, ни кита, за которым следить). См. docstring
# chains/eth/snipe.py и chains/eth/snipe_filter.py.
#
# РИСК: подавляющее большинство новых пар — rug/dead в первые минуты.
# snipe_filter.py — ЧЕСТНО не honeypot-детектор (см. его docstring), только
# дешёвые проверки ликвидности/котировки. Держите snipe_size_pct маленьким,
# используйте canary_start_fraction на новом профиле, отдельный кошелёк.
#
# Требует ОТДЕЛЬНОГО процесса/кошелька от других 3 стратегий при общем
# ETH_PRIVATE_KEY — иначе конфликт nonce.
#
# Запуск: python -m wakefinder.cli run configs/eth-snipe.toml

chain = "eth"
strategy = "snipe"

# Курировать по мере накопления опыта — токены с известными скам-паттернами
# (клоны популярных имён и т.п.), см. README чек-лист про fee-on-transfer.
token_denylist = []

[risk]
snipe_size_pct = 0.5                            # доля баланса на один снайп — маленькая, риск на сделку высокий
snipe_test_amount_eth = 0.01                     # тестовая сумма для котировки/фильтра, не размер входа
snipe_min_liquidity_weth = 2.0                   # ниже — типичный сигнал скам-пары с притворной ликвидностью
snipe_trailing_stop_pct = 30                     # выход при просадке 30% от локального пика после входа
snipe_trailing_stop_check_interval_seconds = 10  # мемкоины волатильнее обычного копитрейда — короткий интервал
snipe_max_concurrent_positions = 3               # кэп на одновременно открытые снайп-позиции
canary_start_fraction = 0.2                      # новый профиль — 20% размера до первых 20 подтверждённых сделок
canary_ramp_trades = 20
max_drawdown_eth = 0.2                           # ниже дефолта (0.5) — стратегия высокорисковая, стоп раньше
