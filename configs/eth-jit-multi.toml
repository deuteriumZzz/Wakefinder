# Профиль: JIT-ликвидность на Uniswap V3 — вариант с НЕСКОЛЬКИМИ пулами
# одним процессом/кошельком (см. docstring chains/eth/jit_liquidity.py:run()
# и cli.py:_jit_pools_from_profile). Для одного пула см. eth-jit.toml —
# он проще (JIT_POOL_* через .env, без этой секции).
#
# Каждая запись [[jit_pools]] — свой pool_address/token0/token1/fee/капитал.
# ОДИН из token0/token1 В КАЖДОМ пуле обязан быть WETH (ETH_WETH_ADDRESS) —
# проверяется на старте, до подписки на мемпул, падает громко при нарушении.
#
# Обработка события (nonce->sign->send) всегда последовательна между
# пулами — общий кошелёк/nonce на процесс, гонки не будет, но и
# параллельного исполнения между пулами тоже нет (см. README "JIT-ликвидность").
#
# КОНСЕРВАТИВНЫЙ первый проход (как и у eth-jit.toml): широкий фиксированный
# tick-диапазон, jit_tick_range_half_width общий на ВСЕ пулы этого профиля.
#
# Запуск: python -m wakefinder.cli run configs/eth-jit-multi.toml

chain = "eth"
strategy = "jit"

[[jit_pools]]
pool_address = "0x0000000000000000000000000000000000000000"  # ЗАМЕНИТЕ: пул #1 (например WETH/USDC 0.3%)
token0 = "0x0000000000000000000000000000000000000000"
token1 = "0x0000000000000000000000000000000000000000"
fee = 3000
capital0_wei = 0
capital1_wei = 0

[[jit_pools]]
pool_address = "0x0000000000000000000000000000000000000000"  # ЗАМЕНИТЕ: пул #2 (например WETH/USDT 0.05%)
token0 = "0x0000000000000000000000000000000000000000"
token1 = "0x0000000000000000000000000000000000000000"
fee = 500
capital0_wei = 0
capital1_wei = 0

[risk]
jit_tick_range_half_width = 100     # широкий диапазон, консервативный первый проход — общий на все пулы
jit_slippage_bps = 100
jit_min_swap_amount_in_wei = 10000000000000000000  # 10 ETH — своп меньше этого не стоит внимания
max_drawdown_eth = 0.3
