# Профиль: Solana backrun-арбитраж. Запуск:
#   python -m wakefinder.cli run configs/solana-arb.toml
# Все адреса ниже — ЗАГЛУШКИ (base58-формат для примера), замените на реальные.

chain = "solana"
strategy = "arb"

min_amount_in = 1000000000  # 1 SOL в lamports

# Пул, за резервами которого следим (watcher.py слушает accountSubscribe на vault'ы).
[[solana_pools]]
pool_id = "11111111111111111111111111111111111111111"       # ЗАГЛУШКА: pool_id (Raydium AMM V4)
base_vault = "11111111111111111111111111111111111111112"    # ЗАГЛУШКА
quote_vault = "11111111111111111111111111111111111111113"   # ЗАГЛУШКА
base_mint = "So11111111111111111111111111111111111111112"   # wrapped SOL
quote_mint = "11111111111111111111111111111111111111114"    # ЗАГЛУШКА: mint токена

# Референсный пул той же пары на ДРУГОМ DEX (см. пояснение в eth-arb.toml —
# тот же принцип: без второго источника ликвидности нет арбитража).
[[reference_pools]]
target_pool = "11111111111111111111111111111111111111111"      # тот же, что pool_id выше
base_vault = "11111111111111111111111111111111111111115"       # ЗАГЛУШКА: vault референсного пула
quote_vault = "11111111111111111111111111111111111111116"      # ЗАГЛУШКА
base_mint = "So11111111111111111111111111111111111111112"
quote_mint = "11111111111111111111111111111111111111114"
dex_label = "orca"
target_base_vault = "11111111111111111111111111111111111111112"
target_quote_vault = "11111111111111111111111111111111111111113"
target_dex_label = "raydium"

[risk]
max_capital_per_bundle_sol = 0.5
min_reference_liquidity_sol = 10.0
