# Профиль: Solana снайпинг новых SPL-минтов — третья, отдельная стратегия
# от арбитража/копитрейдинга. Детекция идёт через факт создания НОВОГО
# МИНТА (не через parsing конкретного AMM — см. подробный docstring
# chains/solana/mint_watcher.py про то, почему выбран именно этот, более
# медленный, но проверяемый сигнал), подтверждение торгуемости — через
# Jupiter (chains/solana/snipe_filter.py).
#
# РИСК: подавляющее большинство новых минтов никогда не получают ликвидный
# пул вообще; из тех, что получают, многие rug/dead в первые минуты.
# Держите snipe_size_pct маленьким, используйте canary_start_fraction на
# новом профиле, отдельный кошелёк от main.py/copytrade.py.
#
# Запуск: python -m wakefinder.cli run configs/solana-snipe.toml

chain = "solana"
strategy = "snipe"

# Курировать по мере накопления опыта — известные скам-паттерны.
token_denylist = []

[risk]
snipe_size_pct = 0.5                            # доля баланса на один снайп — маленькая, риск на сделку высокий
solana_snipe_test_amount_sol = 0.05              # тестовая сумма для Jupiter-котировки/фильтра, не размер входа
solana_snipe_min_liquidity_sol = 1.0             # ниже — типичный сигнал скам-минта с притворной ликвидностью
snipe_trailing_stop_pct = 30                     # выход при просадке 30% от локального пика после входа
snipe_trailing_stop_check_interval_seconds = 10  # свежие минты волатильнее обычного копитрейда — короткий интервал
snipe_max_concurrent_positions = 3               # кэп на одновременно открытые снайп-позиции
canary_start_fraction = 0.2                      # новый профиль — 20% размера до первых 20 подтверждённых сделок
canary_ramp_trades = 20
max_drawdown_sol = 2.0                           # ниже дефолта (5.0) — стратегия высокорисковая, стоп раньше
