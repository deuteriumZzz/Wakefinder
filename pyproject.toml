[project]
name = "wakefinder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "web3>=6.15",
    # Явный прямой пин (не только транзитивный через web3) — SignedTransaction
    # в 0.11.x отдаёт .rawTransaction (camelCase), не .raw_transaction; версия,
    # где это меняется, не проверялась. Пин защищает от тихого расхождения
    # между кодом (написан и протестирован под 0.11.x) и тем, что реально
    # установится в другом окружении по одному лишь web3>=6.15.
    "eth-account>=0.11,<0.12",
    "flashbots>=2.0",
    "solana>=0.36",
    "solders>=0.26",
    "jupiter-python-sdk>=0.0.2",
    "jito-py-rpc>=0.1.5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
wakefinder = "wakefinder.cli:main"
wakefinder-dashboard = "wakefinder.launcher:main"

[tool.setuptools.packages.find]
include = ["wakefinder*"]

[tool.pytest.ini_options]
# anchorpy (транзитивная зависимость jupiter_python_sdk/solana) регистрирует
# свой pytest-плагин, который тянет pytest-asyncio/pytest-xprocess — нам они
# не нужны, просто отключаем автозагрузку плагина.
addopts = "-p no:pytest_anchorpy"

[tool.ruff]
# 230 — под уже существующий стиль (длинные описательные комментарии на
# русском), не произвольный дефолт PEP8: цель — ловить реальные баги
# (неиспользуемые импорты, f-строки без плейсхолдеров и т.п.), не устраивать
# невостребованный реформат всего кода под более узкий лимит.
line-length = 230

[tool.ruff.lint]
select = ["E", "F"]
