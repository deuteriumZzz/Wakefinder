[project]
name = "wakefinder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "web3>=6.15",
    # Явный прямой пин (не только транзитивный через web3) — SignedTransaction
    # в 0.11.x отдаёт .rawTransaction (camelCase), не .raw_transaction; версия,
    # где это меняется, не проверялась. Пин защищает от тихого расхождения
    # между кодом (написан и протестирован под 0.11.x) и тем, что реально
    # установится в другом окружении по одному лишь web3>=6.15.
    "eth-account>=0.11,<0.12",
    "flashbots>=2.0",
    "solana>=0.36",
    "solders>=0.26",
    "jupiter-python-sdk>=0.0.2",
    "jito-py-rpc>=0.1.5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27", "mypy>=1.10"]
web = ["fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
wakefinder = "wakefinder.cli:main"
wakefinder-dashboard = "wakefinder.launcher:main"

[tool.setuptools.packages.find]
include = ["wakefinder*"]

[tool.pytest.ini_options]
# anchorpy (транзитивная зависимость jupiter_python_sdk/solana) регистрирует
# свой pytest-плагин, который тянет pytest-asyncio/pytest-xprocess — нам они
# не нужны, просто отключаем автозагрузку плагина.
addopts = "-p no:pytest_anchorpy"

[tool.ruff]
# 230 — под уже существующий стиль (длинные описательные комментарии на
# русском), не произвольный дефолт PEP8: цель — ловить реальные баги
# (неиспользуемые импорты, f-строки без плейсхолдеров и т.п.), не устраивать
# невостребованный реформат всего кода под более узкий лимит.
line-length = 230

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

# web3.py/solana-py/solders типизируют contract()-вызовы и RPC-ответы
# (WS-подписки, транзакции) по очень строгим литеральным перегрузкам/union'ам,
# которые не отражают реальный риск здесь — проверено построчно в этой
# сессии: настоящие проблемы (None-narrowing, generic-типизация вотчеров)
# найдены и исправлены отдельно, это то, что ОСТАЁТСЯ — известный шум от
# неполных стабов экосистемы, не баги. Разрешаем только эти коды, только там,
# где они реально возникают (contract()-вызовы и RPC-message-хендлинг), чтобы
# НЕ терять сигнал по остальным кодам (union-attr на новом коде вне этого
# паттерна по-прежнему ловится).
[[tool.mypy.overrides]]
module = ["wakefinder.chains.*", "wakefinder.wallet_scanner", "wakefinder.live_state", "wakefinder.backtest"]
disable_error_code = ["call-overload", "arg-type", "assignment", "union-attr", "attr-defined", "index", "var-annotated"]
